# Messages of the ch_oetiker_report_spam_ham_classic zimlet (label and description are
# shown in Preferences > Zimlets). Placeholders: {name}.
label = Report SPAM and HAM
description = Sends a mail to the configured anti-spam address as SPAM, or as HAM when it is in Junk.
button = Send SPAM|HAM
tooltip = Send this mail to the {team} as SPAM, or as HAM when it is in Junk
titleSpam = Send SPAM
titleHam = Send false positive (HAM)
titleMixed = Send SPAM|HAM
textOne = This mail will be sent to the {team} ({address}). The information is used to improve spam detection.
textMany = {n} mails will be sent to the {team} ({address}): {spam} as SPAM, {ham} as HAM. The information is used to improve spam detection.
headersOnly = Headers only
wholeMail = Whole mail
cancel = Cancel
send = Send
doneSpam = {n} sent as SPAM and moved to Junk
doneHam = {n} sent as HAM and moved to Inbox
uncleaned = {n} moved without cleaning (upload failed: {errors})
failed = Report: {done} sent; failed: {list}
hintStored = copy is in Inbox; delete the original in Junk by hand
hintSent = report was sent, mail left in place
nothing = Nothing to report (own sent mail, drafts and shared mail are skipped)
busy = Report is already running
errorPrefix = Report:\u0020
tooltipNoTeam = Send this mail as SPAM, or as HAM when it is in Junk
textOneNoTeam = This mail will be sent to {address}. The information is used to improve spam detection.
textManyNoTeam = {n} mails will be sent to {address}: {spam} as SPAM, {ham} as HAM. The information is used to improve spam detection.
noAddress = No report address is configured. Ask your administrator.
